name: Lint and test

on:
    push:
        branches: ["main"]
    pull_request_target:
        branches: ["main"]
        types: [opened, synchronize, reopened, labeled]

permissions:
    contents: read

jobs:
    validate:
        name: ${{ matrix.package.name }}
        if: >
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        runs-on: [self-hosted, linux]
        strategy:
            fail-fast: false
            matrix:
                package:
                    - name: UI
                      dir: src
                      is_flutter: true
                    - name: MathCore
                      dir: src/packages/math_core
                      is_flutter: false
                    - name: StdDev
                      dir: src/packages/stddev
                      is_flutter: false
                    - name: SyntaxTree
                      dir: src/packages/syntax_tree
                      is_flutter: true

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Set up Flutter (stable)
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: false

            - name: Allow Flutter SDK git directory
              run: git config --global --add safe.directory "$FLUTTER_ROOT"

            - name: Cache pub-cache
              uses: actions/cache@v5
              with:
                  path: ${{ env.PUB_CACHE || '~/.pub-cache' }}
                  key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pub-cache-

            - name: Install Dependencies
              working-directory: ${{ matrix.package.dir }}
              run: |
                  if [ "${{ matrix.package.is_flutter }}" = "true" ]; then
                    flutter pub get
                  else
                    dart pub get
                  fi

            - name: Analyze
              working-directory: ${{ matrix.package.dir }}
              run: |
                  if [ "${{ matrix.package.is_flutter }}" = "true" ]; then
                    flutter analyze --fatal-infos
                  else
                    dart analyze
                  fi

            - name: Run Tests
              if: success() || failure()
              working-directory: ${{ matrix.package.dir }}
              run: |
                  if grep -q "^[[:space:]]*test:" pubspec.yaml || grep -q "^[[:space:]]*flutter_test:" pubspec.yaml; then
                    if [ "${{ matrix.package.is_flutter }}" = "true" ]; then
                      flutter test
                    else
                      dart test
                    fi
                  else
                    echo "No test dependency found; skipping tests for ${{ matrix.package.name }}."
                  fi
