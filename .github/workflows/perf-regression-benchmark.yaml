name: Performance Regression Benchmark

on:
    push:
        branches: ["main"]
    pull_request_target:
        branches: ["main"]
        types: [opened, synchronize, reopened, labeled]

permissions:
    contents: read

jobs:
    perf_regression_benchmark:
        name: Performance Regression Benchmark
        if: >
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        runs-on: [self-hosted, linux]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Set up Flutter (stable)
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: false

            - name: Allow Flutter SDK git directory
              run: git config --global --add safe.directory "$FLUTTER_ROOT"

            - name: Cache pub-cache
              uses: actions/cache@v5
              with:
                  path: ${{ env.PUB_CACHE || '~/.pub-cache' }}
                  key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pub-cache-

            - name: Install Dependencies
              working-directory: src/packages/math_core
              run: flutter pub get

            - name: Run Performance Regression Benchmark
              working-directory: src/packages/math_core
              run: dart run benchmark/perf_regression_benchmark.dart
