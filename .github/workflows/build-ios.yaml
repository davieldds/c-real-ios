name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - ".github/workflows/build-ios.yaml"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (LiveContainer compatible)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Build iOS App (Unsigned for LiveContainer)
        working-directory: src
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: src
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist
          zip -r -y C-Real.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-Real-iOS-LiveContainer
          path: src/dist/C-Real.ipa
          retention-days: 14
